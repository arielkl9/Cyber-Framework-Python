[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberframework"
version = "2.0.0"
description = "Modular reconnaissance and scanning toolkit for authorised security testing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ariel Klinerman" }]
keywords = ["security", "reconnaissance", "scanning", "cve", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "dnspython>=2.6",
    "icmplib>=3.0",
    "python-whois>=0.9",
    "python3-nmap>=1.9",
    "requests>=2.32",
    "scapy>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/arielkl9/Cyber-Framework-Python"
Issues = "https://github.com/arielkl9/Cyber-Framework-Python/issues"

[project.scripts]
cyberframework = "cyberframework.cli:main"

[tool.setuptools]
packages = ["cyberframework"]

[tool.setuptools.package-data]
cyberframework = ["../wordlists/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# ui.py contains ASCII-art banners whose alignment relies on trailing spaces.
"cyberframework/ui.py" = ["E501", "W291"]
